<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="640" height="420" fill="#fff"/>

  <!-- desk -->
  <line x1="20" y1="340" x2="620" y2="340" stroke="#999" stroke-width="2"/>
  <text x="20" y="362" fill="#999" font-size="13">desk</text>

  <!-- box: top face -->
  <path d="M200 150 L380 150 L430 115 L250 115 Z" fill="#efe4d2" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
  <!-- box: front face -->
  <rect x="200" y="150" width="180" height="190" fill="#e6d6bd" stroke="#222" stroke-width="3"/>
  <!-- box: side face -->
  <path d="M380 150 L430 115 L430 305 L380 340 Z" fill="#d7c3a3" stroke="#222" stroke-width="3" stroke-linejoin="round"/>

  <!-- photoresistor on top -->
  <line x1="275" y1="132" x2="275" y2="112" stroke="#222" stroke-width="2"/>
  <circle cx="275" cy="105" r="10" fill="#f3d9a4" stroke="#222" stroke-width="2"/>
  <path d="M269 101 h5 v8 h5" fill="none" stroke="#a33" stroke-width="1.5"/>
  <!-- thermistor on top -->
  <line x1="350" y1="132" x2="350" y2="110" stroke="#222" stroke-width="2"/>
  <ellipse cx="350" cy="104" rx="6" ry="8" fill="#333"/>

  <!-- yellow LED -->
  <circle cx="240" cy="200" r="13" fill="#f5c518" stroke="#222" stroke-width="2"/>
  <!-- blue LED -->
  <circle cx="340" cy="200" r="13" fill="#2b6cd4" stroke="#222" stroke-width="2"/>
  <!-- buzzer holes -->
  <g fill="#222">
    <circle cx="280" cy="275" r="3"/><circle cx="292" cy="275" r="3"/><circle cx="304" cy="275" r="3"/>
    <circle cx="286" cy="287" r="3"/><circle cx="298" cy="287" r="3"/>
  </g>
  <text x="290" y="320" text-anchor="middle" fill="#555" font-weight="700">DeskBuddy</text>

  <!-- usb cable out the side -->
  <path d="M430 270 C 480 270, 490 330, 560 330" fill="none" stroke="#555" stroke-width="3"/>
  <text x="470" y="258" fill="#666" font-size="13">USB power</text>

  <!-- labels -->
  <g fill="#222">
    <line x1="265" y1="100" x2="190" y2="70" stroke="#222"/>
    <text x="40" y="56">Photoresistor</text>
    <text x="40" y="76" fill="#666">is my desk dark?</text>

    <line x1="358" y1="100" x2="430" y2="70" stroke="#222"/>
    <text x="435" y="56">Thermistor</text>
    <text x="435" y="76" fill="#666">is my room cold?</text>

    <line x1="227" y1="200" x2="160" y2="200" stroke="#222"/>
    <text x="20" y="194">Yellow LED</text>
    <text x="20" y="214" fill="#666">"turn on your lamp"</text>

    <line x1="353" y1="200" x2="400" y2="200" stroke="#222"/>
    <line x1="400" y1="200" x2="455" y2="180" stroke="#222"/>
    <text x="460" y="172">Blue LED</text>
    <text x="460" y="192" fill="#666">"it's cold!"</text>

    <line x1="276" y1="280" x2="178" y2="276" stroke="#222"/>
    <text x="20" y="264">Piezo buzzer</text>
    <text x="20" y="284" fill="#666">one beep when cold</text>
  </g>

  <text x="20" y="400" fill="#888" font-size="13">Arduino + breadboard sit inside the box. Sensors poke out through holes in the top.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
